[project]
name = "rsna-2026-kaggle"
version = "0.1.0"
description = "Kaggle and Runpod GPU workflow for RSNA 2026 experiments"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.30,<3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsna2026"]
